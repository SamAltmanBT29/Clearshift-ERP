openapi: 3.1.0
info:
  title: ClearShift Shared API Contracts
  version: 1.0.0
  description: Canonical error envelope, bounded pagination, and event envelope schemas across ClearShift modules.
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-indexed page number
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items per page (maximum 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      required: false
      description: Search text query
      schema:
        type: string
    SortBy:
      name: sortBy
      in: query
      required: false
      description: Field name to sort by
      schema:
        type: string
    SortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor for keyset/log pagination
      schema:
        type: string
    CorrelationIdHeader:
      name: x-correlation-id
      in: header
      required: false
      description: Request correlation identifier
      schema:
        type: string

  schemas:
    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
          description: Field or parameter that failed validation
        message:
          type: string
          description: Human-readable error description
        code:
          type: string
          description: Machine-readable specific error code

    ErrorEnvelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable high-level error code (e.g., BAD_REQUEST, NOT_FOUND)
        message:
          type: string
          description: Safe human-readable summary of the error
        details:
          description: Optional list of field-level errors or diagnostic details
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            - type: object
        correlation_id:
          type: string
          description: Correlation ID for tracing across services
        correlationId:
          type: string
          description: CamelCase alias for correlation_id

    PaginationMeta:
      type: object
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean

    EventEnvelope:
      type: object
      required:
        - id
        - eventType
        - aggregateType
        - aggregateId
        - timestamp
        - version
        - producer
        - payload
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        aggregateType:
          type: string
        aggregateId:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          default: 1
        correlationId:
          type: string
        causationId:
          type: string
        producer:
          type: string
          default: clearshift
        payload:
          type: object

  responses:
    BadRequest:
      description: 400 Invalid request payload or parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: 401 Missing, expired, or invalid authorization token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 403 Insufficient permissions for requested action or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 Requested resource or record does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 409 Request conflicts with existing record or state invariant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: 413 Uploaded payload or file exceeds size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: 422 Business rule invariant or domain transition violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 429 Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: 500 Unexpected internal server failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
