openapi: "3.1.0"

info:
  title: ClearShift ERP — HR & Employees API
  description: |
    **ERP-5 HR & Employees module** — public REST contract.

    Base path: `/api/v1/erp-hr`

    Implements:
    - Employee list, search and create/edit (FR-ERP5-01, FR-ERP5-02)
    - Departments with optional parent hierarchy (FR-ERP5-03)
    - Leave records with date range, type and status (FR-ERP5-04)
    - Read-only Hub Identity user projection (FR-ERP5-05, Master Architecture Spec C3)
    - Department/month payroll aggregates (FR-ERP5-06)

    Domain rules enforced by both the API and the database:
    - `BR-ERP5-01` — join date can never be before the birth date.
    - `BR-ERP5-02` — salary is never returned in full to viewers and never logged.

    Monetary values are returned as **string-encoded decimals** to avoid
    IEEE-754 floating-point rounding. All timestamps are ISO 8601 with timezone.
  version: "1.0.0"
  contact:
    name: ClearShift Engineering — ERP Team
  license:
    name: Private

servers:
  - url: http://localhost:3000/api/v1/erp-hr
    description: Local development server
  - url: https://api.clearshift.internal/api/v1/erp-hr
    description: Staging / production

tags:
  - name: Employees
    description: Employee master records
  - name: Departments
    description: Department hierarchy
  - name: Leave
    description: Leave records
  - name: Identity
    description: Read-only Hub Identity projection
  - name: Payroll
    description: Department/month payroll aggregates

# ────────────────────────────────────────────────────────────────────────────
# Paths
# ────────────────────────────────────────────────────────────────────────────
paths:

  # ── Employees ─────────────────────────────────────────────────────────────
  /employees:
    get:
      operationId: listEmployees
      tags: [Employees]
      summary: List employees
      description: |
        Returns a bounded page of employees. Results are ordered by the
        requested sort field with a deterministic `id` tie-breaker.
        Salary is never returned in full — the `EmployeeView` projection
        exposes `salary_display` only (BR-ERP5-02).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
          description: Server-side case-insensitive search across first name, last name and employee number
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict the result set to one department
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, employee_no, join_date]
            default: name
          description: Allow-listed sort field
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

    post:
      operationId: createEmployee
      tags: [Employees]
      summary: Create an employee
      description: |
        Creates an employee. `employee_no` must be unique across the module
        and `join_date` must not precede `birth_date` (BR-ERP5-01).
        Requires `hr:employees:write` permission.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
            examples:
              employee:
                summary: Create an employee
                value:
                  employee_no: "EMP-0001"
                  first_name: "Asha"
                  last_name: "Iyer"
                  birth_date: "1990-04-12"
                  join_date: "2024-01-08"
                  department_id: "11111111-1111-1111-1111-111111111111"
                  job_title: "Software Engineer"
                  salary: "125000.0000"
                  currency_code: "INR"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [Employees]
      summary: Edit an employee
      description: |
        Updates the allow-listed mutable fields of an employee. The
        `join_date`/`birth_date` pair is re-validated when both are present
        (BR-ERP5-01). `employee_no` remains unique across the module.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  # ── Departments ───────────────────────────────────────────────────────────
  /departments:
    get:
      operationId: listDepartments
      tags: [Departments]
      summary: List departments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
          description: Server-side case-insensitive search across name and code
        - name: parent_id
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict the result set to the children of one department
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, code]
            default: name
          description: Allow-listed sort field
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

    post:
      operationId: createDepartment
      tags: [Departments]
      summary: Create a department
      description: |
        Creates a department. `code` must be unique across the module.
        `parent_id` must reference an existing department; a department can
        never be its own parent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  /departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [Departments]
      summary: Edit a department
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentRequest"
      responses:
        "200":
          description: Department updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  # ── Leave ─────────────────────────────────────────────────────────────────
  /leave:
    get:
      operationId: listLeave
      tags: [Leave]
      summary: List leave records
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: employee_id
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict the result set to one employee
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/LeaveType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LeaveStatus"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

    post:
      operationId: createLeave
      tags: [Leave]
      summary: Create a leave record
      description: |
        Creates a leave record. `date_to` must not precede `date_from` and the
        referenced employee must exist.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequest"
      responses:
        "201":
          description: Leave record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  # ── Identity (read-only projection) ───────────────────────────────────────
  /identity-users:
    get:
      operationId: listIdentityUsers
      tags: [Identity]
      summary: List Hub Identity users (read-only projection)
      description: |
        Returns the read-only Hub Identity projection. HR does not own users,
        does not store credentials and does not grant application roles; the
        projection exposes identity attributes only — no password, hash, token
        or refresh-token field is ever returned.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityUserListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  # ── Payroll totals ────────────────────────────────────────────────────────
  /payroll-totals:
    get:
      operationId: listPayrollTotals
      tags: [Payroll]
      summary: List department/month payroll aggregates
      description: |
        Returns one aggregate per department and month. The payload contains
        department totals only — never employee-level rows (FR-ERP5-06).
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: "^\d{4}-(0[1-9]|1[0-2])$"
          description: Payroll month in YYYY-MM form
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict the result set to one department
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollTotalListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

    post:
      operationId: createPayrollTotal
      tags: [Payroll]
      summary: Load a department/month payroll aggregate
      description: |
        Loads one department/month aggregate. One aggregate exists per
        department and month; a second load for the same pair is rejected with
        409. The payload carries no employee-level data.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayrollTotalRequest"
      responses:
        "201":
          description: Aggregate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollTotal"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

# ────────────────────────────────────────────────────────────────────────────
# Components
# ────────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the resource
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size (deterministic paging, hard cap of 100)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: Optional client-assigned idempotency key for safe retries

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Unique or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:

    ApiError:
      type: object
      description: |
        Standard error envelope. Mirrors the shared platform envelope owned by
        `@cs/kernel` (ErrorEnvelopeSchema) — it is not redefined per module.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          examples: ["HR_JOIN_DATE_AFTER_BIRTH_DATE"]
        message:
          type: string
          description: Human-readable summary
        details:
          type: array
          default: []
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
        correlation_id:
          type: string
          description: Correlation id for log tracing

    ListMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    LeaveType:
      type: string
      enum: [sick, holiday, other]

    LeaveStatus:
      type: string
      enum: [pending, approved, rejected]

    Department:
      type: object
      required: [id, name, code, parent_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 32
          description: Unique department code
        parent_id:
          type: [string, "null"]
          format: uuid
          description: Optional parent department
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDepartmentRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        parent_id:
          type: [string, "null"]
          format: uuid

    UpdateDepartmentRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        parent_id:
          type: [string, "null"]
          format: uuid

    Employee:
      type: object
      description: Privileged employee representation (never returned to viewers).
      required:
        [id, employee_no, first_name, last_name, birth_date, join_date,
         department_id, job_title, salary, currency_code, source_system,
         source_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        employee_no:
          type: string
          maxLength: 32
          description: Unique declared employee identifier
        first_name:
          type: string
          maxLength: 120
        last_name:
          type: string
          maxLength: 120
        birth_date:
          type: string
          format: date
        join_date:
          type: string
          format: date
        department_id:
          type: string
          format: uuid
        job_title:
          type: string
          maxLength: 120
        salary:
          type: string
          pattern: "^\d+(\.\d{1,4})?$"
          description: String-encoded decimal. Masked before serialization for viewers.
        currency_code:
          type: string
          pattern: "^[A-Z]{3}$"
        source_system:
          type: [string, "null"]
          maxLength: 64
        source_id:
          type: [string, "null"]
          maxLength: 128
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EmployeeView:
      type: object
      description: |
        Employee projection for viewers — the raw `salary` column is absent and
        replaced by a masked display value (BR-ERP5-02).
      required:
        [id, employee_no, first_name, last_name, birth_date, join_date,
         department_id, job_title, salary_display, currency_code,
         created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        employee_no:
          type: string
          maxLength: 32
        first_name:
          type: string
          maxLength: 120
        last_name:
          type: string
          maxLength: 120
        birth_date:
          type: string
          format: date
        join_date:
          type: string
          format: date
        department_id:
          type: string
          format: uuid
        job_title:
          type: string
          maxLength: 120
        salary_display:
          type: string
          description: Masked salary — "XX,XXX" or "salary hidden"
          examples: ["XX,XXX"]
        currency_code:
          type: string
          pattern: "^[A-Z]{3}$"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEmployeeRequest:
      type: object
      required:
        [employee_no, first_name, last_name, birth_date, join_date,
         department_id, job_title, salary]
      properties:
        employee_no:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        first_name:
          type: string
          minLength: 1
          maxLength: 120
        last_name:
          type: string
          minLength: 1
          maxLength: 120
        birth_date:
          type: string
          format: date
        join_date:
          type: string
          format: date
          description: Must not precede birth_date (BR-ERP5-01)
        department_id:
          type: string
          format: uuid
        job_title:
          type: string
          minLength: 1
          maxLength: 120
        salary:
          type: string
          pattern: "^\d+(\.\d{1,4})?$"
        currency_code:
          type: string
          pattern: "^[A-Z]{3}$"
        source_system:
          type: string
          maxLength: 64
        source_id:
          type: string
          maxLength: 128

    UpdateEmployeeRequest:
      type: object
      minProperties: 1
      properties:
        employee_no:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        first_name:
          type: string
          minLength: 1
          maxLength: 120
        last_name:
          type: string
          minLength: 1
          maxLength: 120
        birth_date:
          type: string
          format: date
        join_date:
          type: string
          format: date
        department_id:
          type: string
          format: uuid
        job_title:
          type: string
          minLength: 1
          maxLength: 120
        salary:
          type: string
          pattern: "^\d+(\.\d{1,4})?$"
        currency_code:
          type: string
          pattern: "^[A-Z]{3}$"

    Leave:
      type: object
      required: [id, employee_id, date_from, date_to, type, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
          description: Must not precede date_from
        type:
          $ref: "#/components/schemas/LeaveType"
        status:
          $ref: "#/components/schemas/LeaveStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateLeaveRequest:
      type: object
      required: [employee_id, date_from, date_to, type]
      properties:
        employee_id:
          type: string
          format: uuid
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/LeaveType"
        status:
          $ref: "#/components/schemas/LeaveStatus"

    IdentityUser:
      type: object
      description: |
        Read-only Hub Identity projection. Contains no password, hash, token or
        refresh-token field.
      required: [id, username, roles, employee_ref, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        employee_ref:
          type: [string, "null"]
          format: uuid
        status:
          type: string

    PayrollTotal:
      type: object
      description: One aggregate per department and month — never employee rows.
      required:
        [id, department_id, month, total_amount, currency_code, headcount,
         created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        month:
          type: string
          pattern: "^\d{4}-(0[1-9]|1[0-2])$"
        total_amount:
          type: string
