openapi: "3.1.0"

info:
  title: ClearShift ERP — Vendors & Purchasing API
  description: |
    **ERP-2 Vendors & Purchasing module** — public REST contract.

    Base path: `/api/v1/erp-vendors`

    Implements:
    - Vendor list with search and bounded pagination (FR-ERP2-01)
    - Create and edit vendor with server-side masked bank details (FR-ERP2-02, FR-ERP2-06)
    - Purchase orders with line items (FR-ERP2-03)
    - Unidirectional purchase order status lifecycle: Draft -> Sent -> Received -> Closed (FR-ERP2-04)
    - Server-side calculated order totals using decimal arithmetic (FR-ERP2-05)
    - Product line referential integrity via ERP-1 contract (BR-ERP2-01)
    - In-process target adapter and durable import receipts (KIT-08 / Decision C4)

    Amounts are string-encoded decimals (2 decimal places) with ISO currency codes.
    Bank details are masked server-side (`XXXX-XXXX-7890`) and never exposed unmasked.
  version: "1.0.0"
  contact:
    name: ClearShift Engineering — ERP-2 Team
  license:
    name: Private

servers:
  - url: http://localhost:3000/api/v1/erp-vendors
    description: Local development server
  - url: https://api.clearshift.internal/api/v1/erp-vendors
    description: Staging / production

tags:
  - name: Vendors
    description: Vendor catalog management and search
  - name: Purchase Orders
    description: Purchase order creation, calculations, and status transitions
  - name: Migration Import
    description: Migration Kit target adapter and durable import receipts (KIT-08)

paths:
  /vendors:
    get:
      operationId: listVendors
      tags: [Vendors]
      summary: List vendors with search and bounded pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: search
          in: query
          description: Substring match on vendor name
          schema:
            type: string
      responses:
        "200":
          description: Paginated vendor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedVendorsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      operationId: createVendor
      tags: [Vendors]
      summary: Create a vendor record
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorRequest"
      responses:
        "201":
          description: Vendor created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "200":
          description: Idempotent replay of existing vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [Vendors]
      summary: Retrieve a single vendor by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vendor record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateVendor
      tags: [Vendors]
      summary: Update editable fields of a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorRequest"
      responses:
        "200":
          description: Vendor updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      tags: [Purchase Orders]
      summary: List purchase orders with filtering and bounded pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: vendor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PurchaseOrderStatus"
      responses:
        "200":
          description: Paginated purchase order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPurchaseOrdersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      operationId: createPurchaseOrder
      tags: [Purchase Orders]
      summary: Create purchase order with line items and server-computed total
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderRequest"
      responses:
        "201":
          description: Purchase order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "200":
          description: Idempotent replay of existing purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      tags: [Purchase Orders]
      summary: Retrieve purchase order by UUID with lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Purchase order with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updatePurchaseOrderStatus
      tags: [Purchase Orders]
      summary: Update purchase order status (strict forward transitions only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurchaseOrderStatusRequest"
      responses:
        "200":
          description: Purchase order status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /import:
    post:
      operationId: importRow
      tags: [Migration Import]
      summary: Import row via KIT-08 target adapter contract with durable receipts
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRowRequest"
      responses:
        "201":
          description: Target row and receipt committed atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowResponse"
        "200":
          description: Idempotent replay of identical prior import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /import/batch:
    post:
      operationId: importBatch
      tags: [Migration Import]
      summary: Batch import rows via ERP2-11 loadBatch interface with per-row idempotency and optional UPSERT
      description: |
        Processes up to 500 rows sequentially through the ERP-2 target adapter.
        Each row has its own stable idempotency key. A data-validation failure on
        one row does NOT abort subsequent rows (error isolation). Infrastructure
        failures propagate as HTTP 5xx and are retryable. Dry-run semantics are
        enforced by the service layer.

        When `upsert=true`, rows whose natural key (tax_number for vendors) already
        exists in the target will be updated and linked with `kind=linked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBatchRequest"
      responses:
        "200":
          description: Batch processed — returns per-row outcomes and aggregate totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadBatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  schemas:
    PurchaseOrderStatus:
      type: string
      enum: [Draft, Sent, Received, Closed]

    Vendor:
      type: object
      required:
        - id
        - name
        - tax_number
        - email
        - bank_masked
        - currency
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tax_number:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        address_line:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        bank_masked:
          type: string
          pattern: "^XXXX-XXXX-\\d{4}$"
          example: "XXXX-XXXX-7890"
        currency:
          type: string
          example: "USD"
        source_system:
          type: string
          nullable: true
        source_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVendorRequest:
      type: object
      required:
        - name
        - tax_number
        - email
      properties:
        name:
          type: string
        tax_number:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        address_line:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        bank_details:
          type: string
          nullable: true
          description: Raw bank account number. Server masks this immediately to XXXX-XXXX-7890.
        currency:
          type: string
          default: "USD"
        source_system:
          type: string
          nullable: true
        source_id:
          type: string
          nullable: true
        idempotency_key:
          type: string
        batch_id:
          type: string
          format: uuid
        source_row:
          type: integer
          minimum: 0

    UpdateVendorRequest:
      type: object
      properties:
        name:
          type: string
        tax_number:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        address_line:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        bank_details:
          type: string
          nullable: true
        currency:
          type: string
        source_system:
          type: string
          nullable: true
        source_id:
          type: string
          nullable: true

    PaginatedVendorsResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0

    PurchaseOrderLine:
      type: object
      required:
        - id
        - po_id
        - product_id
        - quantity
        - price
        - line_total
      properties:
        id:
          type: string
          format: uuid
        po_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: string
          example: "5.00"
        price:
          type: string
          example: "120.00"
        line_total:
          type: string
          example: "600.00"

    CreatePurchaseOrderLineRequest:
      type: object
      required:
        - product_id
        - quantity
        - price
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: string
          example: "10.00"
        price:
          type: string
          example: "25.50"

    PurchaseOrder:
      type: object
      required:
        - id
        - po_number
        - vendor_id
        - order_date
        - status
        - currency
        - total
        - lines
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        po_number:
          type: string
        vendor_id:
          type: string
          format: uuid
        order_date:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/PurchaseOrderStatus"
        currency:
          type: string
          example: "USD"
        total:
          type: string
          example: "255.00"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderLine"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePurchaseOrderRequest:
      type: object
      required:
        - vendor_id
        - order_date
        - lines
      properties:
        po_number:
          type: string
        vendor_id:
          type: string
          format: uuid
        order_date:
          type: string
          format: date
        currency:
          type: string
          default: "USD"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreatePurchaseOrderLineRequest"
        idempotency_key:
          type: string
        batch_id:
          type: string
          format: uuid
        source_row:
          type: integer
          minimum: 0

    UpdatePurchaseOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/PurchaseOrderStatus"

    PaginatedPurchaseOrdersResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrder"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0

    ImportRowRequest:
      type: object
      required:
        - batch_id
        - source_row
        - idempotency_key
        - entity
        - record
      properties:
        batch_id:
          type: string
          format: uuid
        source_row:
          type: integer
          minimum: 0
        source_system:
          type: string
          nullable: true
        source_id:
          type: string
          nullable: true
        idempotency_key:
          type: string
        correlation_id:
          type: string
          nullable: true
        entity:
          type: string
          enum: [vendor, purchase_order]
        record:
          type: object

    ImportRowResponse:
      type: object
      required:
        - target_id
        - target_version
        - outcome
        - receipt
        - prior_result
      properties:
        target_id:
          type: string
          format: uuid
        target_version:
          type: integer
        outcome:
          type: string
          enum: [loaded, rejected, merged, skipped]
        receipt:
          $ref: "#/components/schemas/ImportReceiptRecord"
        prior_result:
          type: boolean

    ImportReceiptRecord:
      type: object
      required:
        - id
        - batch_id
        - source_row
        - entity
        - schema_version
        - idempotency_key
        - request_hash
        - target_id
        - kind
        - outcome
        - created_at
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        source_row:
          type: integer
        source_system:
          type: string
          nullable: true
        source_id:
          type: string
          nullable: true
        entity:
          type: string
        schema_version:
          type: integer
        idempotency_key:
          type: string
        request_hash:
          type: string
        target_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [created, linked]
        outcome:
          type: string
          enum: [loaded, rejected, merged, skipped]
        response_payload:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time

    ImportBatchRequest:
      type: object
      required:
        - batch_id
        - entity
        - rows
      properties:
        batch_id:
          type: string
          format: uuid
          description: Stable UUID identifying this overall migration batch
        entity:
          type: string
          enum: [vendor, purchase_order]
        upsert:
          type: boolean
          default: false
          description: When true, rows whose natural key already exists will be updated and linked (kind=linked)
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/BatchRowInput"

    BatchRowInput:
      type: object
      required:
        - source_row
        - idempotency_key
        - record
      properties:
        source_row:
          type: integer
          minimum: 0
          description: 0-based row position in the source file
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        source_system:
          type: string
          maxLength: 64
          nullable: true
        source_id:
          type: string
          maxLength: 128
          nullable: true
        record:
          type: object
          description: Cleaned source data mapped to target domain shape

    LoadBatchResult:
      type: object
      required:
        - batchId
        - total
        - loaded
        - rejected
        - rows
      properties:
        batchId:
          type: string
          format: uuid
        total:
          type: integer
        loaded:
          type: integer
        rejected:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/LoadBatchRowResult"

    LoadBatchRowResult:
      type: object
      required:
        - sourceRow
        - idempotencyKey
        - outcome
      properties:
        sourceRow:
          type: integer
        idempotencyKey:
          type: string
        outcome:
          type: string
          enum: [loaded, rejected]
        result:
          type: object
          nullable: true
          description: Present when outcome=loaded
        error:
          type: object
          nullable: true
          description: Present when outcome=rejected

    ApiError:
      type: object
      required:
        - statusCode
        - error
        - message
      properties:
        statusCode:
          type: integer
        error:
          type: string
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items: {}
        correlation_id:
          type: string

  responses:
    BadRequest:
      description: Bad Request / Validation Failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Idempotency Key Payload Mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnprocessableEntity:
      description: Domain Invariant Violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: Transient Infrastructure Failure (Retryable)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
