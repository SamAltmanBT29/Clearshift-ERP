openapi: 3.1.0
info:
  title: ERP-1 Products & Inventory API Contract
  version: 1.1.0
  description: |
    Public API specification for the ClearShift ERP Products and Inventory
    module (Group 6 / ERP-1). Collections use deterministic, bounded
    server-side pagination. Writes that the Migration Kit can replay accept an
    `Idempotency-Key` header or the equivalent body field.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/erp-products/products:
    get:
      operationId: listErp1Products
      tags: [ERP-1 Products]
      summary: List products with search by name/SKU and bounded pagination
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: categoryId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: unitOfMeasure
          in: query
          required: false
          schema: { $ref: '#/components/schemas/UnitOfMeasure' }
        - name: stockStatus
          in: query
          required: false
          schema:
            type: string
            enum: [all, in_stock, low_stock, out_of_stock]
        - name: minPrice
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d{1,4})?$'
        - name: maxPrice
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d{1,4})?$'
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, sku, price, createdAt, quantity]
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Deterministically ordered page of products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createErp1Product
      tags: [ERP-1 Products]
      summary: Create a product with unique SKU and decimal price
      description: |
        Creates a zero-quantity stock row at the default warehouse. A retry with
        the same idempotency key and payload returns the original product with
        `prior_result: true` and `200`; a different payload returns `409`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductInput' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMutationResponse' }
        '200':
          description: Idempotent replay of an earlier successful create
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMutationResponse' }
        '400':
          description: Validation error or negative price
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Duplicate SKU or idempotency-key payload mismatch
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '422':
          description: Unknown category
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/products/{id}:
    get:
      operationId: getErp1Product
      tags: [ERP-1 Products]
      summary: Read a single product by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: Malformed identifier
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    patch:
      operationId: updateErp1Product
      tags: [ERP-1 Products]
      summary: Update editable product fields by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductInput' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: Invalid payload or protected field
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "409":
          description: Concurrent modification conflict or duplicate SKU conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "422":
          description: Database invariant violation
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/products/{id}/linked-records:
    get:
      operationId: getErp1ProductLinkedRecords
      tags: [ERP-1 Products]
      summary: Read linked inventory, purchasing, and sales records for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Linked records for product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductLinkedRecords' }
        "404":
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/migration-metadata:
    get:
      operationId: getErp1MigrationMetadata
      tags: [ERP-1 Migration Kit]
      summary: Retrieve ERP-1 target schema metadata for shared Migration Kit wizard
      responses:
        "200":
          description: ERP-1 module migration metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleMigrationMetadata' }

  /api/v1/erp-products/rejections:
    get:
      operationId: listErp1Rejections
      tags: [ERP-1 Migration Kit]
      summary: List migration rejection records with module context and standardized error codes
      parameters:
        - name: batchId
          in: query
          required: false
          schema: { type: string }
        - name: errorCode
          in: query
          required: false
          schema: { type: string }
        - name: entity
          in: query
          required: false
          schema: { type: string, default: products }
      responses:
        "200":
          description: List of rejected rows with module context
          content:
            application/json:
              schema:
                type: object
                required: [items, total, context]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RejectedRow' }
                  total: { type: integer, minimum: 0 }
                  context: { $ref: '#/components/schemas/ModuleRejectionContext' }

  /api/v1/erp-products/categories:

    get:
      operationId: listErp1Categories
      tags: [ERP-1 Categories]
      summary: List one-level product categories
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Deterministically ordered page of categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createErp1Category
      tags: [ERP-1 Categories]
      summary: Create a product category
      description: |
        Category codes are unique case-insensitively. A retry with the same
        idempotency key and payload returns the original category with
        `prior_result: true` and `200`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryInput' }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryMutationResponse' }
        '200':
          description: Idempotent replay of an earlier successful create
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryMutationResponse' }
        '400':
          description: Validation error or protected field
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Duplicate category code or idempotency-key payload mismatch
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/categories/{id}:
    get:
      operationId: getErp1Category
      tags: [ERP-1 Categories]
      summary: Read a single category by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          description: Malformed identifier
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Category not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    patch:
      operationId: updateErp1Category
      tags: [ERP-1 Categories]
      summary: Update editable category fields by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryInput' }
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          description: Invalid payload or protected field
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Category not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '409':
          description: Duplicate category code conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/stock:
    get:
      operationId: listErp1Stock
      tags: [ERP-1 Stock]
      summary: List stock levels with product and warehouse filters
      description: |
        For backwards compatibility, when `productId` is supplied and exactly
        one level matches, its fields are also copied to the top level of the
        response.
      parameters:
        - name: productId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of stock levels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevelListResponse' }
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/erp-products/stock/opening:
    post:
      operationId: setErp1OpeningStock
      tags: [ERP-1 Stock]
      summary: Set the absolute opening stock quantity for a product
      description: |
        Opening stock is an absolute upsert into the single V1 default
        warehouse. A stable idempotency key is mandatory, either as the
        `Idempotency-Key` header or as `idempotency_key` / `idempotencyKey` in
        the body. The stock mutation and durable import receipt commit
        atomically. Replaying the same key and payload returns the original
        result with `prior_result: true`; a different payload returns `409`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetOpeningStockInput' }
      responses:
        '200':
          description: Opening stock recorded or idempotently replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpeningStockResponse' }
        '400':
          description: Missing idempotency key or invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '409':
          description: Idempotency-key payload mismatch
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        '422':
          description: Negative quantity, unknown warehouse, or non-default warehouse in V1
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Search:
      name: search
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for replay-safe migration loads; may instead be supplied in the JSON body.
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated role lacks the required capability
      content:
        application/json:
          schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  schemas:
    UnitOfMeasure:
      type: string
      enum: [pcs, kg, g, litre, metre, box]

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Uppercase ISO 4217 currency code. There is no implicit V1 default.
      example: USD
    ImportProvenance:
      type: object
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 255 }
        batch_id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        source_row: { type: integer, minimum: 0 }
        sourceRow: { type: integer, minimum: 0 }
        source_system: { type: string, maxLength: 64 }
        sourceSystem: { type: string, maxLength: 64 }
        source_id: { type: string, maxLength: 128 }
        sourceId: { type: string, maxLength: 128 }

    PaginationFields:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    Category:
      type: object
      required: [id, name, code, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CategoryListResponse:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Category' }
        - $ref: '#/components/schemas/PaginationFields'

    CategoryMutationResponse:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [prior_result]
          properties:
            prior_result: { type: boolean }

    CreateCategoryInput:
      allOf:
        - type: object
          required: [name, code]
          properties:
            name: { type: string, minLength: 1, maxLength: 255 }
            code: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/schemas/ImportProvenance'
      additionalProperties: false

    UpdateCategoryInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, minLength: 1, maxLength: 64 }

    Product:
      type: object
      required: [id, name, sku, normalizedSku, unitOfMeasure, price, currency, taxRate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sku: { type: string }
        normalizedSku: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        price:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: "19.9900"
        currency: { $ref: '#/components/schemas/Currency' }
        taxRate:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        notificationEmail: { type: string, format: email, nullable: true }
        contactPhone: { type: string, nullable: true }
        sourceSystem: { type: string, nullable: true }
        sourceId: { type: string, nullable: true }
        goldenId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductListResponse:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Product' }
        - $ref: '#/components/schemas/PaginationFields'

    ProductMutationResponse:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [prior_result]
          properties:
            prior_result: { type: boolean }

    CreateProductInput:
      allOf:
        - type: object
          required: [name, sku, unitOfMeasure, price, currency]
          properties:
            name: { type: string, minLength: 1, maxLength: 255 }
            sku: { type: string, minLength: 1, maxLength: 128 }
            categoryId: { type: string, format: uuid, nullable: true }
            unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
            price: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }
            currency: { $ref: '#/components/schemas/Currency' }
            taxRate: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,2})?$' }, { type: number, minimum: 0 }], default: "0.00" }
            notificationEmail: { type: string, format: email, description: "Optional supplier or alert notification email address" }
            contactPhone: { type: string, pattern: '^\+?[0-9\s\-()]{7,20}$', description: "Optional supplier contact phone number" }
        - $ref: '#/components/schemas/ImportProvenance'
      additionalProperties: false

    UpdateProductInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        price: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }
        currency: { $ref: '#/components/schemas/Currency' }
        taxRate: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,2})?$' }, { type: number, minimum: 0 }] }
        notificationEmail: { type: string, format: email }
        contactPhone: { type: string, pattern: '^\+?[0-9\s\-()]{7,20}$' }
        version: { type: string }

    ProductWarehouseStockLinkedRecord:
      type: object
      required: [warehouseId, warehouseCode, warehouseName, quantity, unitOfMeasure, updatedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseCode: { type: string }
        warehouseName: { type: string }
        quantity: { type: string, pattern: '^\d+(\.\d{1,4})?$' }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        updatedAt: { type: string, format: date-time }

    ProductPurchaseLineLinkedRecord:
      type: object
      required: [id, purchaseOrderId, poNumber, vendorName, orderDate, quantity, unitPrice, currency, status]
      properties:
        id: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        poNumber: { type: string }
        vendorName: { type: string }
        orderDate: { type: string }
        quantity: { type: string }
        unitPrice: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string }

    ProductSalesLineLinkedRecord:
      type: object
      required: [id, orderId, orderNumber, customerGoldenId, orderDate, quantity, unitPrice, lineTotal, currency, status]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        customerGoldenId: { type: string }
        orderDate: { type: string }
        quantity: { type: string }
        unitPrice: { type: string }
        lineTotal: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string }

    ProductLinkedRecords:
      type: object
      required: [productId, stockLevels, purchaseOrders, salesOrders]
      properties:
        productId: { type: string, format: uuid }
        stockLevels:
          type: array
          items: { $ref: '#/components/schemas/ProductWarehouseStockLinkedRecord' }
        purchaseOrders:
          type: array
          items: { $ref: '#/components/schemas/ProductPurchaseLineLinkedRecord' }
        salesOrders:
          type: array
          items: { $ref: '#/components/schemas/ProductSalesLineLinkedRecord' }

    StockLevel:
      type: object
      required: [id, productId, warehouseId, quantity, updatedAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: "100.0000"
        updatedAt: { type: string, format: date-time }

    StockLevelListResponse:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StockLevel' }
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          description: Flattened single-product compatibility fields, present only when productId matched exactly one level.
          properties:
            id: { type: string, format: uuid }
            productId: { type: string, format: uuid }
            warehouseId: { type: string, format: uuid }
            quantity: { type: string }
            updatedAt: { type: string, format: date-time }

    ImportReceipt:
      type: object
      required: [id, batch_id, source_row, target_id, target_entity, idempotency_key, outcome, created_at]
      properties:
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }

    ProductListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
