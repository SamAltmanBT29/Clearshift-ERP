openapi: 3.1.0
info:
  title: ERP-1 Products & Inventory API Contract
  version: 1.0.0
  description: Public API specification for ClearShift ERP Products and Inventory module (Group 6 / ERP-1).
paths:
  /api/v1/erp-products/products:
    get:
      operationId: listErp1Products
      tags: [ERP-1 Products]
      summary: List products with search by name/SKU and bounded pagination
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: categoryId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: unitOfMeasure
          in: query
          required: false
          schema: { $ref: '#/components/schemas/UnitOfMeasure' }
        - name: stockStatus
          in: query
          required: false
          schema:
            type: string
            enum: [all, in_stock, low_stock, out_of_stock]
        - name: minPrice
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d{1,4})?$'
        - name: maxPrice
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d{1,4})?$'
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, sku, price, createdAt, quantity]
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "401":
          description: Unauthenticated session
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "403":
          description: Forbidden (missing inventory:read capability)
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    post:
      operationId: createErp1Product
      tags: [ERP-1 Products]
      summary: Create a product with unique SKU, explicit currency and decimal price
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductInput' }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "409":
          description: Duplicate SKU or normalized SKU conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "422":
          description: Database invariant violation (negative price/tax or invalid currency)
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/products/{id}:
    get:
      operationId: getErp1Product
      tags: [ERP-1 Products]
      summary: Read a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "404":
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    patch:
      operationId: updateErp1Product
      tags: [ERP-1 Products]
      summary: Update a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductInput' }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "404":
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "422":
          description: Database invariant violation
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/categories:
    get:
      operationId: listErp1Categories
      tags: [ERP-1 Categories]
      summary: List one-level product categories
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated category list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    post:
      operationId: createErp1Category
      tags: [ERP-1 Categories]
      summary: Create a product category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryInput' }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "409":
          description: Category code conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/categories/{id}:
    patch:
      operationId: updateErp1Category
      tags: [ERP-1 Categories]
      summary: Update a one-level product category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryInput' }
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "404":
          description: Category not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "409":
          description: Category code conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/stock:
    get:
      operationId: listErp1Stock
      tags: [ERP-1 Stock]
      summary: Get stock level for a product and the V1 warehouse
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stock level record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevel' }
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "404":
          description: Product or warehouse not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/stock/opening:
    post:
      operationId: setErp1OpeningStock
      tags: [ERP-1 Stock]
      summary: Set the initial opening stock quantity for a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetOpeningStockInput' }
      responses:
        "200":
          description: Opening stock recorded idempotently for the product/warehouse pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevel' }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "404":
          description: Product or warehouse not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "422":
          description: Negative quantity rejected (BR-ERP1-02)
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

components:
  schemas:
    UnitOfMeasure:
      type: string
      enum: [pcs, kg, g, litre, metre, box]

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Uppercase ISO 4217 currency code. There is no implicit V1 default.
      example: USD

    Category:
      type: object
      required: [id, name, code, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCategoryInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }

    UpdateCategoryInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }

    Product:
      type: object
      required: [id, name, sku, normalizedSku, unitOfMeasure, price, currency, taxRate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sku: { type: string }
        normalizedSku: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        price:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: "19.9900"
        currency: { $ref: '#/components/schemas/Currency' }
        taxRate:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        sourceSystem: { type: string, nullable: true }
        sourceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateProductInput:
      type: object
      required: [name, sku, unitOfMeasure, price, currency]
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: string, minLength: 1 }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        price: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }
        currency: { $ref: '#/components/schemas/Currency' }
        taxRate: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,2})?$' }, { type: number, minimum: 0 }], default: "0.00" }
        sourceSystem: { type: string, minLength: 1, maxLength: 64 }
        sourceId: { type: string, minLength: 1, maxLength: 128 }

    UpdateProductInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        price: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }
        currency: { $ref: '#/components/schemas/Currency' }
        taxRate: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,2})?$' }, { type: number, minimum: 0 }] }

    StockLevel:
      type: object
      required: [id, productId, warehouseId, quantity, updatedAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: "100.0000"
        updatedAt: { type: string, format: date-time }

    SetOpeningStockInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }

    ProductListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    CategoryListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
