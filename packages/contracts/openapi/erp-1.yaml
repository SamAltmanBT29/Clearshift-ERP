openapi: 3.1.0
info:
  title: ERP-1 Products & Inventory API Contract
  version: 1.0.0
  description: Public API specification for ClearShift ERP Products and Inventory module (Group 6 / ERP-1).
paths:
  /api/v1/erp-products/products:
    get:
      operationId: listErp1Products
      tags: [ERP-1 Products]
      summary: List products with search by name/SKU and bounded pagination
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: categoryId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: unitOfMeasure
          in: query
          required: false
          schema: { $ref: '#/components/schemas/UnitOfMeasure' }
        - name: stockStatus
          in: query
          required: false
          schema:
            type: string
            enum: [all, in_stock, low_stock, out_of_stock]
        - name: minPrice
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d{1,4})?$'
        - name: maxPrice
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d{1,4})?$'
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, sku, price, createdAt, quantity]
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "401":
          description: Unauthenticated session
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "403":
          description: Forbidden (missing inventory:read capability)
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    post:
      operationId: createErp1Product
      tags: [ERP-1 Products]
      summary: Create a product with unique SKU, explicit currency and decimal price
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductInput' }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "409":
          description: Duplicate SKU or normalized SKU conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "422":
          description: Database invariant violation (negative price/tax or invalid currency)
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/products/{id}:
    get:
      operationId: getErp1Product
      tags: [ERP-1 Products]
      summary: Read a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "404":
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    patch:
      operationId: updateErp1Product
      tags: [ERP-1 Products]
      summary: Update a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductInput' }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "404":
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "409":
          description: Concurrent modification conflict or duplicate SKU conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "422":
          description: Database invariant violation
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/products/{id}/linked-records:
    get:
      operationId: getErp1ProductLinkedRecords
      tags: [ERP-1 Products]
      summary: Read linked inventory, purchasing, and sales records for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Linked records for product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductLinkedRecords' }
        "404":
          description: Product not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/migration-metadata:
    get:
      operationId: getErp1MigrationMetadata
      tags: [ERP-1 Migration Kit]
      summary: Retrieve ERP-1 target schema metadata for shared Migration Kit wizard
      responses:
        "200":
          description: ERP-1 module migration metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleMigrationMetadata' }

  /api/v1/erp-products/rejections:
    get:
      operationId: listErp1Rejections
      tags: [ERP-1 Migration Kit]
      summary: List migration rejection records with module context and standardized error codes
      parameters:
        - name: batchId
          in: query
          required: false
          schema: { type: string }
        - name: errorCode
          in: query
          required: false
          schema: { type: string }
        - name: entity
          in: query
          required: false
          schema: { type: string, default: products }
      responses:
        "200":
          description: List of rejected rows with module context
          content:
            application/json:
              schema:
                type: object
                required: [items, total, context]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RejectedRow' }
                  total: { type: integer, minimum: 0 }
                  context: { $ref: '#/components/schemas/ModuleRejectionContext' }

  /api/v1/erp-products/categories:

    get:
      operationId: listErp1Categories
      tags: [ERP-1 Categories]
      summary: List one-level product categories
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated category list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    post:
      operationId: createErp1Category
      tags: [ERP-1 Categories]
      summary: Create a product category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryInput' }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "409":
          description: Category code conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/categories/{id}:
    get:
      operationId: getErp1Category
      tags: [ERP-1 Categories]
      summary: Retrieve a one-level product category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Category details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        "404":
          description: Category not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
    patch:
      operationId: updateErp1Category
      tags: [ERP-1 Categories]
      summary: Update a one-level product category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryInput' }
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "404":
          description: Category not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "409":
          description: Category code conflict
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/stock:
    get:
      operationId: listErp1Stock
      tags: [ERP-1 Stock]
      summary: Get stock level for a product and the V1 warehouse
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stock level record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevel' }
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "404":
          description: Product or warehouse not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

  /api/v1/erp-products/stock/opening:
    post:
      operationId: setErp1OpeningStock
      tags: [ERP-1 Stock]
      summary: Set the initial opening stock quantity for a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetOpeningStockInput' }
      responses:
        "200":
          description: Opening stock recorded idempotently for the product/warehouse pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevel' }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "404":
          description: Product or warehouse not found
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }
        "422":
          description: Negative quantity rejected (BR-ERP1-02)
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' }

components:
  schemas:
    UnitOfMeasure:
      type: string
      enum: [pcs, kg, g, litre, metre, box]

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Uppercase ISO 4217 currency code. There is no implicit V1 default.
      example: USD

    Category:
      type: object
      required: [id, name, code, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCategoryInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }

    UpdateCategoryInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }

    Product:
      type: object
      required: [id, name, sku, normalizedSku, unitOfMeasure, price, currency, taxRate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sku: { type: string }
        normalizedSku: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        price:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: "19.9900"
        currency: { $ref: '#/components/schemas/Currency' }
        taxRate:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        notificationEmail: { type: string, format: email, nullable: true }
        contactPhone: { type: string, nullable: true }
        sourceSystem: { type: string, nullable: true }
        sourceId: { type: string, nullable: true }
        goldenId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateProductInput:
      type: object
      required: [name, sku, unitOfMeasure, price, currency]
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: string, minLength: 1 }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        price: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }
        currency: { $ref: '#/components/schemas/Currency' }
        taxRate: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,2})?$' }, { type: number, minimum: 0 }], default: "0.00" }
        notificationEmail: { type: string, format: email, description: "Optional supplier or alert notification email address" }
        contactPhone: { type: string, pattern: '^\+?[0-9\s\-()]{7,20}$', description: "Optional supplier contact phone number" }
        sourceSystem: { type: string, minLength: 1, maxLength: 64 }
        sourceId: { type: string, minLength: 1, maxLength: 128 }

    UpdateProductInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        price: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }
        currency: { $ref: '#/components/schemas/Currency' }
        taxRate: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,2})?$' }, { type: number, minimum: 0 }] }
        notificationEmail: { type: string, format: email }
        contactPhone: { type: string, pattern: '^\+?[0-9\s\-()]{7,20}$' }
        version: { type: string }

    ProductWarehouseStockLinkedRecord:
      type: object
      required: [warehouseId, warehouseCode, warehouseName, quantity, unitOfMeasure, updatedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseCode: { type: string }
        warehouseName: { type: string }
        quantity: { type: string, pattern: '^\d+(\.\d{1,4})?$' }
        unitOfMeasure: { $ref: '#/components/schemas/UnitOfMeasure' }
        updatedAt: { type: string, format: date-time }

    ProductPurchaseLineLinkedRecord:
      type: object
      required: [id, purchaseOrderId, poNumber, vendorName, orderDate, quantity, unitPrice, currency, status]
      properties:
        id: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        poNumber: { type: string }
        vendorName: { type: string }
        orderDate: { type: string }
        quantity: { type: string }
        unitPrice: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string }

    ProductSalesLineLinkedRecord:
      type: object
      required: [id, orderId, orderNumber, customerGoldenId, orderDate, quantity, unitPrice, lineTotal, currency, status]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        customerGoldenId: { type: string }
        orderDate: { type: string }
        quantity: { type: string }
        unitPrice: { type: string }
        lineTotal: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string }

    ProductLinkedRecords:
      type: object
      required: [productId, stockLevels, purchaseOrders, salesOrders]
      properties:
        productId: { type: string, format: uuid }
        stockLevels:
          type: array
          items: { $ref: '#/components/schemas/ProductWarehouseStockLinkedRecord' }
        purchaseOrders:
          type: array
          items: { $ref: '#/components/schemas/ProductPurchaseLineLinkedRecord' }
        salesOrders:
          type: array
          items: { $ref: '#/components/schemas/ProductSalesLineLinkedRecord' }

    StockLevel:
      type: object
      required: [id, productId, warehouseId, quantity, updatedAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: "100.0000"
        updatedAt: { type: string, format: date-time }

    SetOpeningStockInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,4})?$' }, { type: number, minimum: 0 }] }

    ProductListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    CategoryListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    TargetFieldDefinition:
      type: object
      required: [name, label, type, required]
      properties:
        name: { type: string }
        label: { type: string }
        type: { type: string, enum: [string, number, decimal, boolean, date, enum, uuid] }
        required: { type: boolean }
        description: { type: string }
        enumOptions:
          type: array
          items: { type: string }
        rules:
          type: array
          items: { type: string }
        example:
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }

    TargetEntityMetadata:
      type: object
      required: [entity, label, module, schemaVersion, targetTable, primaryKey, fields]
      properties:
        entity: { type: string }
        label: { type: string }
        module: { type: string }
        schemaVersion: { type: integer, minimum: 1 }
        targetTable: { type: string }
        primaryKey: { type: string }
        naturalKey: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TargetFieldDefinition' }
        mappingDefaults:
          type: object
          additionalProperties: { type: string }
        validationRules:
          type: array
          items:
            type: object
            required: [code, description]
            properties:
              code: { type: string }
              description: { type: string }

    ModuleMigrationMetadata:
      type: object
      required: [moduleId, moduleName, defaultEntity, entities]
      properties:
        moduleId: { type: string }
        moduleName: { type: string }
        defaultEntity: { type: string }
        entities:
          type: object
          additionalProperties: { $ref: '#/components/schemas/TargetEntityMetadata' }
        supportedSourceTypes:
          type: array
          items: { type: string }

    RejectionColumnConfig:
      type: object
      required: [field, label]
      properties:
        field: { type: string }
        label: { type: string }
        isIdentifier: { type: boolean }
        isSensitive: { type: boolean }

    FailureExplanation:
      type: object
      required: [code, title, explanation]
      properties:
        code: { type: string }
        title: { type: string }
        explanation: { type: string }
        docReference: { type: string }
        resolution: { type: string }

    ModuleRejectionContext:
      type: object
      required: [moduleId, moduleName, entity, identifierColumns, failureExplanations]
      properties:
        moduleId: { type: string }
        moduleName: { type: string }
        entity: { type: string }
        identifierColumns:
          type: array
          items: { $ref: '#/components/schemas/RejectionColumnConfig' }
        additionalColumns:
          type: array
          items: { $ref: '#/components/schemas/RejectionColumnConfig' }
        sensitiveFields:
          type: array
          items: { type: string }
        failureExplanations:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FailureExplanation' }

    RejectedRow:
      type: object
      required: [id, batchId, sourceRow, entity, errorCode, rawData]
      properties:
        id: { type: string }
        batchId: { type: string }
        sourceRow: { type: integer, minimum: 1 }
        entity: { type: string }
        schemaVersion: { type: integer, minimum: 1 }
        errorCode: { type: string }
        failureReason: { type: string }
        field: { type: string }
        rawData:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    DataQualityRule:
      type: object
      required: [rule_id, version, record_type, field, condition, action, explanation, doc_reference]
      properties:
        rule_id: { type: string }
        version: { type: string }
        record_type: { type: string, enum: [category, warehouse, product, stock_level, all] }
        field: { type: string }
        condition: { type: string }
        action: { type: string, enum: [normalize, reject, review] }
        reason_code: { type: string }
        explanation: { type: string }
        doc_reference: { type: string }

    ReconciliationSummary:
      type: object
      required: [total_source_rows, accepted, rejected, review, skipped, unaccounted, is_balanced]
      properties:
        total_source_rows: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        review: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        unaccounted: { type: integer, minimum: 0 }
        is_balanced: { type: boolean }

    DirtyDataProfileReport:
      type: object
      required: [profile_schema_version, rules_version, module, fixture, fixture_sha256, total_rows, reconciliation, by_record_type, by_reason_code, generated_at]
      properties:
        profile_schema_version: { type: integer, minimum: 1 }
        rules_version: { type: string }
        module: { type: string, enum: [erp1] }
        fixture: { type: string }
        fixture_sha256: { type: string }
        total_rows: { type: integer, minimum: 0 }
        reconciliation: { $ref: '#/components/schemas/ReconciliationSummary' }
        by_record_type:
          type: object
          additionalProperties:
            type: object
            required: [accepted, rejected, review, skipped, total]
            properties:
              accepted: { type: integer, minimum: 0 }
              rejected: { type: integer, minimum: 0 }
              review: { type: integer, minimum: 0 }
              skipped: { type: integer, minimum: 0 }
              total: { type: integer, minimum: 0 }
        by_reason_code:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        rows:
          type: object
          additionalProperties:
            type: object
            required: [outcome, reasons]
            properties:
              outcome: { type: string, enum: [accepted, rejected, review, skipped] }
              reasons: { type: array, items: { type: string } }
        generated_at: { type: string, format: date-time }



