        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    CategoryListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    TargetFieldDefinition:
      type: object
      required: [name, label, type, required]
      properties:
        name: { type: string }
        label: { type: string }
        type: { type: string, enum: [string, number, decimal, boolean, date, enum, uuid] }
        required: { type: boolean }
        description: { type: string }
        enumOptions:
          type: array
          items: { type: string }
        rules:
          type: array
          items: { type: string }
        example:
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }

    TargetEntityMetadata:
      type: object
      required: [entity, label, module, schemaVersion, targetTable, primaryKey, fields]
