openapi: "3.1.0"

info:
  title: ClearShift ERP — Sales Orders & Invoices API
  description: |
    **ERP-3 Sales Orders & Invoices module** — public REST contract.

    Base path: `/api/v1/erp-orders`

    Implements:
    - Sales Orders with lines (FR-ERP3-01, FR-ERP3-05)
    - Invoices with lines and status (FR-ERP3-02)
    - Payment records and auto-Paid transition (FR-ERP3-03, FR-ERP3-04)
    - Domain invariants: BR-ERP3-01 (line totals = order total), BR-ERP3-02 (tax per line),
      BR-ERP3-03 (mandatory customer Golden ID)

    All amounts are returned as **string-encoded decimals** (numeric strings)
    to avoid IEEE-754 floating-point rounding. Clients must use a
    fixed-precision decimal library for arithmetic.

    ⚠️ **Unresolved: DR-1** — SDS §3.2 mandates `numeric(19,4)` monetary storage and
    Master Architecture Spec Decision `M2` + `@cs/core` `Money` specify `ROUND_HALF_UP` at
    currency scale (2 dp for INR/USD, stored as `.toFixed(4)`), while SDS §4.4 `BR-ERP3-02`
    states *"Tax per line = line amount multiplied by the product tax rate, rounded to 2 decimals."*
    Pending Integration Lead confirmation of whether intermediate `quantity * price` and `tax_amount`
    round at 2 dp (zero-padded to 4 dp) or 4 dp, the mock uses exact 4-dp arithmetic and returns
    `422 DR1_ROUNDING_UNRESOLVED` on sub-4-dp fractions.

    All timestamps are ISO 8601 with timezone (UTC).
    All dates are ISO 8601 date-only strings (YYYY-MM-DD).

    **Endpoint & schema authority note (`CLEARSHIFT_V1_MASTER_ARCHITECTURE_SPEC.md` Decision `C1`):**
    - **DR-2 (`due_date`):** Authoritatively mandatory per `V1_30_ISSUE_STANDARDIZATION_PLAN.md` §8
      (*"due date is mandatory for overdue calculation"*) and Master Spec §5c ERD (`ERP3_INVOICES.due_date`),
      which supersede its omission from the SDS §4.7 summary table under Decision `C1`.
    - **DR-3 (Detail routes):** `GET /sales-orders`, `POST /sales-orders`, `GET /invoices`, `POST /invoices`,
      `POST /payments` are explicitly listed in SDS §4.8.
      `GET /sales-orders/{id}` and `GET /invoices/{id}` are required by `V1_30_ISSUE_STANDARDIZATION_PLAN.md`
      §7 Slot 04 (*Detail/read API*) and Master Spec §6.1 / Decision `H1` (*Full authoritative route set derived at G1*),
      consistent with ERP-1, ERP-2, ERP-4, and ERP-5, but are **NOT explicitly listed in SDS §4.8**.
      They are included here and in the mock and flagged for Integration Lead Gate G1 sign-off.

  version: "1.0.0"
  contact:
    name: ClearShift Engineering — ERP Team (Group 8)
  license:
    name: Private

servers:
  - url: http://localhost:3000/api/v1/erp-orders
    description: Local development server
  - url: https://api.clearshift.internal/api/v1/erp-orders
    description: Staging / production

tags:
  - name: Sales Orders
    description: Sales order creation and lifecycle management
  - name: Invoices
    description: Invoice creation and status management
  - name: Payments
    description: Payment records and invoice settlement

security:
  - BearerAuth: []

# ────────────────────────────────────────────────────────────────────────────
# Paths
# ────────────────────────────────────────────────────────────────────────────
paths:
  # ── Sales Orders ────────────────────────────────────────────────────────────
  /sales-orders:
    get:
      operationId: listSalesOrders
      tags: [Sales Orders]
      summary: List sales orders (paged)
      x-required-roles: [viewer, editor, admin]
      description: |
        Returns a paginated list of sales orders.
        Supports filtering by status, customer_golden_id, currency, and date range.
        Ordered by `order_date` descending, then `id` ascending as tie-breaker.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (hard cap of 100)
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive search on order_number
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SalesOrderStatus"
          description: Filter by order status
        - name: customer_golden_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by customer Golden ID (UUID)
        - name: currency
          in: query
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
            minLength: 3
            maxLength: 3
          description: Filter by ISO 4217 currency code
        - name: from_date
          in: query
          schema:
            type: string
            format: date
          description: Filter orders on or after this date (YYYY-MM-DD)
        - name: to_date
          in: query
          schema:
            type: string
            format: date
          description: Filter orders on or before this date (YYYY-MM-DD)
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

    post:
      operationId: createSalesOrder
      tags: [Sales Orders]
      summary: Create a new sales order
      x-required-roles: [editor, migration_runner, admin]
      description: |
        Creates a sales order with one or more lines.

        **Domain rules enforced (server-side):**
        - BR-ERP3-01: Server computes `total` from lines. Client-supplied total is ignored.
        - BR-ERP3-03: `customer_golden_id` is mandatory; missing → 422.
        - `order_number` uniqueness: duplicate → 409.
        - `product_id` must reference a valid ERP-1 product; unknown → 422.

        ⚠️ DR-1: Tax and line total rounding rule not yet confirmed.
        The mock never rounds: a value not exactly representable at 4 dp
        returns 422 `DR1_ROUNDING_UNRESOLVED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalesOrderRequest"
      responses:
        "201":
          description: Sales order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Conflict — `order_number` already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                statusCode: 409
                error: Conflict
                code: ORDER_NUMBER_EXISTS
                message: "A sales order with this order number already exists."
        "422":
          description: |
            Business rule violation — missing customer_golden_id or unknown product reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                statusCode: 422
                error: Unprocessable Entity
                code: MISSING_CUSTOMER_GOLDEN_ID
                message: "Sales order must have a valid customer_golden_id (BR-ERP3-03)."
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  # ── Sales Order Detail (implied — not in SDS §4.8 table; flagged for confirmation) ──
  /sales-orders/{id}:
    get:
      operationId: getSalesOrder
      tags: [Sales Orders]
      summary: Get a single sales order by ID
      x-required-roles: [viewer, editor, admin]
      description: |
        Returns a sales order with all embedded lines.

        ⚠️ **Note:** This endpoint is implied by the standard V1 CRUD pattern and required
        by the mock but is NOT explicitly listed in SDS §4.8. Flagged for Integration Lead
        confirmation before the implementation issue (ERP3-04) is started.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Sales order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Sales order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                statusCode: 404
                error: Not Found
                code: ORDER_NOT_FOUND
                message: "Sales order not found."
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []
    patch:
      operationId: updateSalesOrderStatus
      tags: [Sales Orders]
      summary: Update sales order status
      x-required-roles: [editor, admin]
      description: |
        Updates the lifecycle status of a sales order. Allowed forward transitions only:
        Open -> Invoiced, Invoiced -> Closed, Open -> Closed.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalesOrderStatusRequest"
      responses:
        "200":
          description: Sales order status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Sales order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                statusCode: 404
                error: Not Found
                code: ORDER_NOT_FOUND
                message: "Sales order not found."
        "422":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                statusCode: 422
                error: Unprocessable Entity
                code: INVALID_STATUS_TRANSITION
                message: "Invalid sales order status transition."
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  # ── Invoices ────────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: listInvoices
      tags: [Invoices]
      summary: List invoices (paged)
      x-required-roles: [viewer, editor, admin]
      description: |
        Returns a paginated list of invoices.
        Supports filtering by status, customer_golden_id, order_id, currency, and date range.
        Ordered by `invoice_date` descending, then `id` ascending as tie-breaker.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (hard cap of 100)
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive search on invoice_number
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
          description: Filter by invoice status
        - name: customer_golden_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by customer Golden ID
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by source sales order ID
        - name: currency
          in: query
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
            minLength: 3
            maxLength: 3
          description: Filter by ISO 4217 currency code
        - name: from_date
          in: query
          schema:
            type: string
            format: date
          description: Filter invoices on or after this invoice_date (YYYY-MM-DD)
        - name: to_date
          in: query
          schema:
            type: string
            format: date
          description: Filter invoices on or before this invoice_date (YYYY-MM-DD)
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

    post:
      operationId: createInvoice
      tags: [Invoices]
      summary: Create a new invoice
      x-required-roles: [editor, migration_runner, admin]
      description: |
        Creates an invoice with one or more lines.

        **Domain rules enforced (server-side):**
        - `invoice_number` uniqueness: duplicate → 409.
        - `customer_golden_id` is mandatory.
        - `due_date` is mandatory (V1_30 plan: required for overdue calculation).
        - Server computes `total` from lines. Client-supplied total is ignored.
        - `order_id` if supplied must reference an existing sales order → 422 otherwise.

        ⚠️ DR-1: Tax and line total rounding rule not yet confirmed.
        The mock never rounds: a value not exactly representable at 4 dp
        returns 422 `DR1_ROUNDING_UNRESOLVED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Conflict — `invoice_number` already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                statusCode: 409
                error: Conflict
                code: INVOICE_NUMBER_EXISTS
                message: "An invoice with this invoice number already exists."
        "422":
          description: |
            Business rule violation — unknown order reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  # ── Invoice Detail (implied — not in SDS §4.8 table; flagged for confirmation) ──
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [Invoices]
      summary: Get a single invoice by ID
      x-required-roles: [viewer, editor, admin]
      description: |
        Returns an invoice with all embedded lines.

        ⚠️ **Note:** This endpoint is implied by the standard V1 CRUD pattern and required
        by the mock but is NOT explicitly listed in SDS §4.8. Flagged for Integration Lead
        confirmation before the implementation issue (ERP3-04) is started.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Invoice found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                statusCode: 404
                error: Not Found
                code: INVOICE_NOT_FOUND
                message: "Invoice not found."
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  # ── Payments ─────────────────────────────────────────────────────────────────
  /payments:
    post:
      operationId: createPayment
      tags: [Payments]
      summary: Record a payment against an invoice
      x-required-roles: [editor, migration_runner, admin]
      description: |
        Records a payment for an invoice.

        **Domain rules enforced (server-side):**
        - `invoice_id` must reference an existing, non-Paid invoice → 404 / 422.
        - FR-ERP3-04: When `SUM(payments) >= invoice.total`, the invoice status
          automatically transitions to `Paid`.
        - A payment that would push total payments above invoice total is rejected → 422.

        ⚠️ DR-1: Comparison of payment sum to invoice total uses the stored decimal
        values. Rounding rule for this comparison is not confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                statusCode: 404
                error: Not Found
                code: INVOICE_NOT_FOUND
                message: "Invoice not found."
        "422":
          description: |
            Business rule violation — invoice already paid or payment exceeds total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                alreadyPaid:
                  summary: Invoice already paid
                  value:
                    statusCode: 422
                    error: Unprocessable Entity
                    code: INVOICE_ALREADY_PAID
                    message: "Invoice is already paid. No further payments are accepted."
                exceedsTotal:
                  summary: Payment exceeds invoice total
                  value:
                    statusCode: 422
                    error: Unprocessable Entity
                    code: PAYMENT_EXCEEDS_INVOICE_TOTAL
                    message: "Payment amount would exceed the invoice total."
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []
    get:
      operationId: listPayments
      tags: [Payments]
      summary: List payments (paged)
      x-required-roles: [viewer, editor, admin]
      description: |
        Retrieves a paginated list of recorded payments with optional invoice filtering.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (hard cap of 100)
        - name: invoice_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by invoice UUID
      responses:
        "200":
          description: Paginated payment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

  /import:
    post:
      operationId: importErp3Row
      tags: [Sales Orders, Invoices, Payments]
      summary: Load one validated migration row
      x-required-roles: [migration_runner, admin]
      description: |
        Writes one sales order, invoice, or payment through the module-owned
        adapter and stores its idempotency receipt in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRowRequest"
      responses:
        "201":
          description: Row loaded and receipt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowResponse"
        "200":
          description: Idempotent replay returned the prior result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency key reused with a different request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - BearerAuth: []

# ────────────────────────────────────────────────────────────────────────────
# Components
# ────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Hub-issued JWT. All endpoints require a valid token.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Entity UUID primary key

  # ── Schemas ──────────────────────────────────────────────────────────────────
  schemas:
    ImportRowRequest:
      type: object
      required: [batch_id, source_row, idempotency_key, entity, record]
      properties:
        batch_id:
          type: string
          format: uuid
        source_row:
          type: integer
          minimum: 0
        source_system:
          type: [string, "null"]
          maxLength: 64
        source_id:
          type: [string, "null"]
          maxLength: 128
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        correlation_id:
          type: [string, "null"]
          maxLength: 128
        entity:
          type: string
          minLength: 1
          maxLength: 64
          enum: [sales_order, invoice, payment]
        record:
          type: object
          additionalProperties: true
    ImportRowResponse:
      type: object
      required: [target_id, target_version, outcome, receipt, prior_result]
      properties:
        target_id:
          type: string
          format: uuid
        target_version:
          oneOf:
            - type: number
            - type: string
        outcome:
          type: string
          enum: [loaded, rejected, merged, skipped]
        receipt:
          type: object
          additionalProperties: true
        prior_result:
          type: boolean
    # Enums
    SalesOrderStatus:
      type: string
      enum: [Open, Invoiced, Closed]
      description: |
        Sales order lifecycle (FR-ERP3-05).
        Forward-only FSM: Open → Invoiced → Closed.

    InvoiceStatus:
      type: string
      enum: [Open, Paid, Overdue]
      description: |
        Invoice payment status (FR-ERP3-02).
        Transitions to Paid automatically when SUM(payments) == total (FR-ERP3-04).

    PaymentMethod:
      type: string
      enum: [cash, bank, card]
      description: Payment method (FR-ERP3-03).

    # ── Sales Order Line ──────────────────────────────────────────────────────
    SalesOrderLine:
      type: object
      required:
        - id
        - order_id
        - product_id
        - quantity
        - price
        - tax_rate
        - tax_amount
        - line_total
        - created_at
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: ERP-1 product UUID reference (never stored locally).
        quantity:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: Quantity as string-encoded non-negative decimal (up to 4 dp).
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: Unit price as string-encoded non-negative decimal (up to 4 dp).
        tax_rate:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: Tax rate percentage (e.g. "18.0000" = 18%).
        tax_amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: |
            Server-computed tax amount.
            ⚠️ DR-1: Rounding rule not yet confirmed by project specification.
        line_total:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: |
            Server-computed line total (price × quantity + tax_amount).
            BR-ERP3-01: SUM(line_total) must equal order.total.
            ⚠️ DR-1: Rounding rule not yet confirmed.
        created_at:
          type: string
          format: date-time

    CreateSalesOrderLineRequest:
      type: object
      required:
        - product_id
        - quantity
        - price
        - tax_rate
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: Must be > 0.
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        tax_rate:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: Tax rate percentage string (e.g. "18.0000").

    # ── Sales Order ───────────────────────────────────────────────────────────
    SalesOrder:
      type: object
      required:
        - id
        - order_number
        - customer_golden_id
        - order_date
        - status
        - currency
        - total
        - lines
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
          minLength: 1
          maxLength: 64
        customer_golden_id:
          type: string
          format: uuid
          description: Hub Golden ID UUID (ADR-003). Mandatory per BR-ERP3-03.
        order_date:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/SalesOrderStatus"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          minLength: 3
          maxLength: 3
        total:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: |
            Server-computed total. Equals SUM(line.line_total) per BR-ERP3-01.
            ⚠️ DR-1: Rounding rule not confirmed.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SalesOrderLine"
        source_system:
          type: [string, "null"]
          maxLength: 64
        source_id:
          type: [string, "null"]
          maxLength: 128
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSalesOrderRequest:
      type: object
      required:
        - customer_golden_id
        - order_date
        - currency
        - lines
      properties:
        order_number:
          type: string
          minLength: 1
          maxLength: 64
          description: If omitted, server generates a unique number.
        customer_golden_id:
          type: string
          format: uuid
          description: Mandatory per BR-ERP3-03.
        order_date:
          type: string
          format: date
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          minLength: 3
          maxLength: 3
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateSalesOrderLineRequest"
        source_system:
          type: [string, "null"]
          maxLength: 64
        source_id:
          type: [string, "null"]
          maxLength: 128
        idempotency_key:
          type: [string, "null"]
          maxLength: 128
        batch_id:
          type: [string, "null"]
          format: uuid
        source_row:
          type: [integer, "null"]
          minimum: 0

    SalesOrderListResponse:
      type: object
      required:
        - data
        - total
        - page
        - pageSize
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SalesOrder"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalPages:
          type: integer
          minimum: 0

    # ── Invoice Line ──────────────────────────────────────────────────────────
    InvoiceLine:
      type: object
      required:
        - id
        - invoice_id
        - product_id
        - quantity
        - price
        - tax_rate
        - tax_amount
        - line_total
        - created_at
      properties:
        id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        tax_rate:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        tax_amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: ⚠️ DR-1 Rounding rule not confirmed.
        line_total:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        created_at:
          type: string
          format: date-time

    CreateInvoiceLineRequest:
      type: object
      required:
        - product_id
        - quantity
        - price
        - tax_rate
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        tax_rate:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"

    # ── Invoice ───────────────────────────────────────────────────────────────
    Invoice:
      type: object
      required:
        - id
        - invoice_number
        - customer_golden_id
        - invoice_date
        - due_date
        - status
        - currency
        - total
        - lines
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        invoice_number:
          type: string
          minLength: 1
          maxLength: 64
        order_id:
          type: [string, "null"]
          format: uuid
          description: Source sales order UUID. Nullable for standalone invoices.
        customer_golden_id:
          type: string
          format: uuid
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          description: |
            Authoritatively mandatory per V1_30_ISSUE_STANDARDIZATION_PLAN.md §8
            ("due date is mandatory for overdue calculation") and Master Spec §5c ERD
            (ERP3_INVOICES.due_date), which prevail over SDS §4.7 table omission under Decision C1.
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          minLength: 3
          maxLength: 3
        total:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: |
            Server-computed total. ⚠️ DR-1: Rounding rule not confirmed.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"
        source_system:
          type: [string, "null"]
          maxLength: 64
        source_id:
          type: [string, "null"]
          maxLength: 128
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateInvoiceRequest:
      type: object
      required:
        - customer_golden_id
        - invoice_date
        - due_date
        - currency
        - lines
      properties:
        invoice_number:
          type: string
          minLength: 1
          maxLength: 64
        order_id:
          type: [string, "null"]
          format: uuid
        customer_golden_id:
          type: string
          format: uuid
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          description: Mandatory per V1_30 plan §8 and Master Spec §5c ERD (Decision C1).
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          minLength: 3
          maxLength: 3
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateInvoiceLineRequest"
        source_system:
          type: [string, "null"]
          maxLength: 64
        source_id:
          type: [string, "null"]
          maxLength: 128
        idempotency_key:
          type: [string, "null"]
          maxLength: 128
        batch_id:
          type: [string, "null"]
          format: uuid
        source_row:
          type: [integer, "null"]
          minimum: 0

    InvoiceListResponse:
      type: object
      required:
        - data
        - total
        - page
        - pageSize
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalPages:
          type: integer
          minimum: 0

    # ── Payment ───────────────────────────────────────────────────────────────
    Payment:
      type: object
      required:
        - id
        - invoice_id
        - amount
        - paid_at
        - method
        - created_at
      properties:
        id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: Payment amount as string-encoded non-negative decimal (up to 4 dp).
        paid_at:
          type: string
          format: date-time
        method:
          $ref: "#/components/schemas/PaymentMethod"
        created_at:
          type: string
          format: date-time

    CreatePaymentRequest:
      type: object
      required:
        - invoice_id
        - amount
        - method
      properties:
        invoice_id:
          type: string
          format: uuid
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: Must be > 0.
        paid_at:
          type: string
          format: date-time
          description: Defaults to current server time if omitted.
        method:
          $ref: "#/components/schemas/PaymentMethod"
        idempotency_key:
          type: [string, "null"]
          maxLength: 128
        batch_id:
          type: [string, "null"]
          format: uuid
        source_row:
          type: [integer, "null"]
          minimum: 0

    PaymentListResponse:
      type: object
      required:
        - data
        - total
        - page
        - pageSize
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalPages:
          type: integer
          minimum: 0

    UpdateSalesOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/SalesOrderStatus"

    # ── Error Envelope (ADR-002 / PLT-04) ─────────────────────────────────────
    ApiError:
      type: object
      required:
        - statusCode
        - error
        - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: HTTP error class (e.g. "Bad Request")
        code:
          type: string
          description: Machine-readable error code (e.g. ORDER_NOT_FOUND)
        message:
          type: string
          description: Human-readable error summary
        details:
          type: array
          items: {}
          description: Optional field-level error details
        correlation_id:
          type: string
          description: Request correlation ID for tracing

  # ── Responses ─────────────────────────────────────────────────────────────
  responses:
    ValidationError:
      description: |
        400 Bad Request — Schema or pagination validation failure.
        code: VALIDATION_ERROR or BAD_REQUEST
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            statusCode: 400
            error: Bad Request
            code: VALIDATION_ERROR
            message: "pageSize cannot exceed 100"
            details:
              - field: pageSize
                message: pageSize cannot exceed 100
                code: VALUE_OUT_OF_RANGE

    Unauthorized:
      description: |
        401 Unauthorized — Missing or invalid JWT.
        code: UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            statusCode: 401
            error: Unauthorized
            code: UNAUTHORIZED
            message: "Authentication token is missing or expired."

    Forbidden:
      description: |
        403 Forbidden — Authenticated user lacks the required role.
        code: FORBIDDEN
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            statusCode: 403
            error: Forbidden
            code: FORBIDDEN
            message: "You do not have permission to perform this action."

    InternalError:
      description: |
        500 Internal Server Error — Unhandled exception or infrastructure failure.
        code: INTERNAL_SERVER_ERROR
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            statusCode: 500
            error: Internal Server Error
            code: INTERNAL_SERVER_ERROR
            message: "An unexpected error occurred."
