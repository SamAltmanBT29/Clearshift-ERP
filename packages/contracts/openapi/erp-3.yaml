openapi: "3.1.0"

info:
  title: ClearShift ERP — Sales Orders & Invoices API (ERP-3)
  description: |
    **ERP-3 Sales Orders and Invoices module** — public REST contract.

    Base path: `/api/v1/erp-orders`

    Implements:
    - Sales Orders and Line Items (FR-ERP3-01, BR-ERP3-01..03)
    - Invoices with Due Date and Overdue status (FR-ERP3-02, FR-ERP3-05)
    - Payment records and Automatic Paid state transition (FR-ERP3-03, FR-ERP3-04)

    Non-negotiables:
    - Every order requires a valid customer Golden ID (`gid-*`).
    - Line subtotal and tax are calculated server-side; sum of lines must equal order total.
    - Tax per line = line amount * product tax rate, rounded to 2 decimal places.
    - Invoice has a required `due_date`; status is `paid` when sum of payments equals invoice total, `overdue` when unpaid and current UTC date > `due_date`, otherwise `open`.
    - Amounts are formatted as string-encoded decimals to prevent IEEE-754 floating-point inaccuracies.
  version: "1.0.0"
  contact:
    name: ClearShift Engineering — ERP Group 8
  license:
    name: Private

servers:
  - url: /api/v1/erp-orders
    description: Local development / gateway relative path

tags:
  - name: Sales Orders
    description: Sales orders creation, listing, details, and status updates
  - name: Invoices
    description: Invoices listing, creation, and status tracking
  - name: Payments
    description: Payment recording and reconciliation

paths:
  /sales-orders:
    get:
      operationId: listSalesOrders
      tags: [Sales Orders]
      summary: List sales orders with bounded paging and filters
      description: |
        Returns paginated sales orders. Maximum page size is 100.
        Supports search by order number or customer Golden ID, and status filtering.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Bounded number of records per page (max 100)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive search on orderNumber or customerGoldenId
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, invoiced, closed]
          description: Filter by sales order status
        - name: customerGoldenId
          in: query
          required: false
          schema:
            type: string
          description: Filter by exact customer Golden ID
        - name: currencyCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 3
      responses:
        "200":
          description: Paginated sales orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSalesOrdersResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    post:
      operationId: createSalesOrder
      tags: [Sales Orders]
      summary: Create a new sales order with line items
      description: |
        Validates customer Golden ID, verifies line item tax and totals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalesOrderInput"
      responses:
        "201":
          description: Sales order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "400":
          description: Validation error or rule violation (e.g. invalid customer Golden ID or empty lines)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sales-orders/{id}:
    get:
      operationId: getSalesOrderById
      tags: [Sales Orders]
      summary: Retrieve a single sales order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sales order retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "404":
          description: Sales order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    patch:
      operationId: updateSalesOrderStatus
      tags: [Sales Orders]
      summary: Update sales order status (allowed transitions only)
      description: Transitions between Open -> Invoiced -> Closed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalesOrderStatusInput"
      responses:
        "200":
          description: Sales order status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "400":
          description: Invalid status transition

  /invoices:
    get:
      operationId: listInvoices
      tags: [Invoices]
      summary: List invoices with bounded paging and search/filter
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, paid, overdue]
        - name: customerGoldenId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Paginated invoices list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedInvoicesResponse"

    post:
      operationId: createInvoice
      tags: [Invoices]
      summary: Create an invoice from an existing sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceInput"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Validation error

  /invoices/{id}:
    get:
      operationId: getInvoiceById
      tags: [Invoices]
      summary: Retrieve an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found

  /payments:
    get:
      operationId: listPayments
      tags: [Payments]
      summary: List payments
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: invoiceId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Paginated payments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPaymentsResponse"

    post:
      operationId: createPayment
      tags: [Payments]
      summary: Record a full payment against an invoice
      description: |
        V1 accepts one full payment per invoice. When accepted payment equals invoice total,
        the invoice status automatically transitions to Paid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentInput"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Validation error or overpayment

components:
  schemas:
    SalesOrderLine:
      type: object
      required: [id, productId, quantity, unitPrice, taxRate, taxAmount, lineTotal]
      properties:
        id:
          type: string
        orderId:
          type: string
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: string
        taxRate:
          type: string
        taxAmount:
          type: string
        lineTotal:
          type: string

    CreateSalesOrderLineInput:
      type: object
      required: [productId, quantity, unitPrice, taxRate]
      properties:
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: string
        taxRate:
          type: string

    SalesOrder:
      type: object
      required: [id, orderNumber, customerGoldenId, orderDate, status, subtotal, taxTotal, total, currencyCode]
      properties:
        id:
          type: string
        orderNumber:
          type: string
        customerGoldenId:
          type: string
        orderDate:
          type: string
          format: date
        status:
          type: string
          enum: [open, invoiced, closed]
        subtotal:
          type: string
        taxTotal:
          type: string
        total:
          type: string
        currencyCode:
          type: string
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SalesOrderLine"
        createdAt:
          type: string
        updatedAt:
          type: string

    PaginatedSalesOrdersResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SalesOrder"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    CreateSalesOrderInput:
      type: object
      required: [customerGoldenId, orderDate, lines]
      properties:
        customerGoldenId:
          type: string
        orderDate:
          type: string
          format: date
        currencyCode:
          type: string
          default: USD
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CreateSalesOrderLineInput"

    UpdateSalesOrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, invoiced, closed]
        reason:
          type: string

    Invoice:
      type: object
      required: [id, invoiceNumber, orderId, customerGoldenId, invoiceDate, dueDate, total, status]
      properties:
        id:
          type: string
        invoiceNumber:
          type: string
        orderId:
          type: string
        customerGoldenId:
          type: string
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        total:
          type: string
        paidAmount:
          type: string
        currencyCode:
          type: string
        status:
          type: string
          enum: [open, paid, overdue]
        notes:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    PaginatedInvoicesResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    CreateInvoiceInput:
      type: object
      required: [orderId, invoiceDate, dueDate]
      properties:
        orderId:
          type: string
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        notes:
          type: string

    Payment:
      type: object
      required: [id, invoiceId, amount, currencyCode, paidAt, method]
      properties:
        id:
          type: string
        invoiceId:
          type: string
        amount:
          type: string
        currencyCode:
          type: string
        paidAt:
          type: string
          format: date
        method:
          type: string
          enum: [cash, bank, card]
        reference:
          type: string
        createdAt:
          type: string

    PaginatedPaymentsResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    CreatePaymentInput:
      type: object
      required: [invoiceId, amount, paidAt, method]
      properties:
        invoiceId:
          type: string
        amount:
          type: string
        paidAt:
          type: string
          format: date
        method:
          type: string
          enum: [cash, bank, card]
        reference:
          type: string

    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
        correlation_id:
          type: string
