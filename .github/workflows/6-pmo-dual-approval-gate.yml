name: 🛡️ PMO Approval Gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]

jobs:
  verify-pmo-approvals:
    name: Validate Mandatory PMO Reviews (Soldier224K & amankoli09)
    runs-on: ubuntu-latest
    steps:
      - name: Check PMO Approvals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "🔍 Fetching reviews for PR #${PR_NUMBER} in ${REPO}..."
          
          # Fetch reviews via GitHub CLI / API
          REVIEWS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100")
          
          # Compute latest review state per user (reviews are chronological)
          SOLDIER_STATE=$(echo "$REVIEWS" | jq -r '[.[] | select(.user.login | ascii_downcase == "soldier224k")] | last | .state // "NONE"')
          AMAN_STATE=$(echo "$REVIEWS" | jq -r '[.[] | select(.user.login | ascii_downcase == "amankoli09")] | last | .state // "NONE"')
          
          AUTHOR_LOWER=$(echo "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
          
          # Check if author is one of the reviewers
          if [ "$AUTHOR_LOWER" = "soldier224k" ]; then
            SOLDIER_STATE="AUTHOR"
          fi
          if [ "$AUTHOR_LOWER" = "amankoli09" ]; then
            AMAN_STATE="AUTHOR"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 CLEARSHIFT V1 PMO REVIEW GATE (PMO LEAD SIGN-OFF)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  PR Author    : @${PR_AUTHOR}"
          echo "  @Soldier224K : ${SOLDIER_STATE}"
          echo "  @amankoli09  : ${AMAN_STATE}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          FAILED=0

          if [ "$AUTHOR_LOWER" = "soldier224k" ]; then
            if [ "$AMAN_STATE" != "APPROVED" ]; then
              echo "❌ MISSING APPROVAL: PR author is @Soldier224K; requires review approval from @amankoli09."
              FAILED=1
            else
              echo "✅ PMO Lead approval verified: @amankoli09 has approved."
            fi
          elif [ "$AUTHOR_LOWER" = "amankoli09" ]; then
            if [ "$SOLDIER_STATE" != "APPROVED" ]; then
              echo "❌ MISSING APPROVAL: PR author is @amankoli09; requires review approval from @Soldier224K."
              FAILED=1
            else
              echo "✅ PMO Lead approval verified: @Soldier224K has approved."
            fi
          else
            # Module Team / Contributor PR: Either PMO Lead can approve
            if [ "$SOLDIER_STATE" != "APPROVED" ] && [ "$AMAN_STATE" != "APPROVED" ]; then
              echo "❌ MISSING APPROVAL: Pull request requires approval from at least one PMO Lead (@Soldier224K or @amankoli09)."
              FAILED=1
            else
              echo "✅ PMO Lead approval verified:"
              [ "$SOLDIER_STATE" = "APPROVED" ] && echo "   - Approved by @Soldier224K"
              [ "$AMAN_STATE" = "APPROVED" ] && echo "   - Approved by @amankoli09"
            fi
          fi

          echo ""
          if [ "$FAILED" -eq 1 ]; then
            echo "⛔ GATE BLOCKED: Required PMO approval not yet satisfied."
            exit 1
          else
            echo "🎉 GATE PASSED: PMO review approval verified. PR is cleared for PMO merge."
            exit 0
          fi
